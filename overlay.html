<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Neon City Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Orbitron:wght@500;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<!-- OBS browser source: the Administrator's Dashboard tab drives this page through OBS (see README). obs-config.js is gitignored. -->
<script src="obs-config.js"></script>
<script src="obs-link.js"></script>
<script src="overlay-rules.js"></script>
<script src="icons.js"></script>
<style>
  :root {
    --cyan: #00f0ff;
    --magenta: #ff2bd6;
    --yellow: #f5ff3b;
    --bg: #07060f;
    --panel-w: 40vw;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100vw; height: 100vh; overflow: hidden;
    background: transparent;
    font-family: "Share Tech Mono", Consolas, monospace;
    color: #fff;
  }

  .panel {
    position: absolute; top: 0; left: 0;
    width: var(--panel-w); height: 100vh;
    /* height split: heat 20% · influence/day 20% · dice 20% · results 40% */
    display: grid; grid-template-rows: 2fr 2fr 2fr 4fr; grid-template-columns: 100%;
    justify-items: center; align-items: center;
    padding: 3vh 2.5vw;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 4px),
      radial-gradient(ellipse at 50% 0%, #2a0a3d 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, #00313a 0%, transparent 55%),
      var(--bg);
    border-right: 3px solid var(--cyan);
    box-shadow: 0 0 18px var(--cyan), inset -12px 0 30px -18px var(--cyan);
  }
  body.right .panel {
    left: auto; right: 0;
    border-right: 0; border-left: 3px solid var(--cyan);
    box-shadow: 0 0 18px var(--cyan), inset 12px 0 30px -18px var(--cyan);
  }

  /* ---------- Section labels ---------- */
  .label {
    font-family: "Orbitron", sans-serif; font-weight: 500;
    font-size: 1.15vw; letter-spacing: 0.6em; padding-left: 0.6em;
    color: var(--cyan); text-shadow: 0 0 8px var(--cyan);
    display: flex; align-items: center; gap: 1vw; justify-content: center;
  }
  .label::before, .label::after { content: ""; width: 4vw; height: 2px; background: currentColor; box-shadow: 0 0 6px currentColor; }

  /* ---------- Heat ---------- */
  .heat { text-align: center; --glow: #ff5a3c; }
  .heat-row { display: flex; align-items: center; justify-content: center; gap: 2.2vw; margin-top: 1vh; }
  .heat-icon { height: 6.6vw; width: auto; overflow: visible; --ink: var(--glow); --paper: #fff3ec; }
  .heat-icon .ink   { filter: drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 18px var(--glow)); }
  .heat-icon .paper { filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px var(--glow)); }
  .heat .label { color: #ff5a3c; text-shadow: 0 0 8px #ff5a3c; }
  .heat-value {
    font-family: "Chakra Petch", "Orbitron", sans-serif; font-weight: 700;
    font-size: 7.2vw; line-height: 1;
    color: #fff3ec;
    text-shadow: 0 0 6px #fff, 0 0 18px var(--glow), 0 0 42px var(--glow), 0 0 80px var(--glow);
    display: inline-block;
  }
  .heat-value.bump-up   { animation: bumpUp 0.55s ease-out; }
  .heat-value.bump-down { animation: bumpDown 0.55s ease-out; }
  @keyframes bumpUp {
    0% { transform: scale(1); } 25% { transform: scale(1.35); filter: brightness(1.8); } 100% { transform: scale(1); }
  }
  @keyframes bumpDown {
    0% { transform: scale(1); } 25% { transform: scale(0.75); opacity: 0.5; filter: hue-rotate(160deg); } 100% { transform: scale(1); }
  }

  /* ---------- Group Influence + Day ---------- */
  .stats { display: grid; grid-template-columns: 1.2fr 0.8fr; width: 100%; align-items: start; }
  .stat { text-align: center; }
  .stat .label { font-size: 0.95vw; letter-spacing: 0.3em; padding-left: 0.3em; gap: 0.6vw; white-space: nowrap; }
  .stat .label::before, .stat .label::after { width: 1.4vw; }
  .stat-row { display: flex; align-items: center; justify-content: center; gap: 1.3vw; height: 6vw; margin-top: 1vh; }
  .stat-value {
    font-family: "Chakra Petch", "Orbitron", sans-serif; font-weight: 700; font-size: 5.4vw; line-height: 1;
    color: #fff; display: inline-block;
    text-shadow: 0 0 6px #fff, 0 0 16px var(--c), 0 0 38px var(--c);
  }
  .stat-value.broker { font-size: 2.6vw; letter-spacing: 0.12em; }
  .influence { --c: #5b7bff; }
  .day { --c: #c77dff; }
  .stat .label { color: var(--c); text-shadow: 0 0 8px var(--c); }
  .influence-icon { height: 4.8vw; width: 4.8vw; overflow: visible; --ink: var(--c); --paper: #eef1ff; }
  .influence-icon .ink   { filter: drop-shadow(0 0 5px var(--c)) drop-shadow(0 0 14px var(--c)); }
  .influence-icon .paper { filter: drop-shadow(0 0 4px #fff); }
  .stat-value.bump-up   { animation: bumpUp 0.55s ease-out; }
  .stat-value.bump-down { animation: bumpDown 0.55s ease-out; }

  /* ---------- Dice ---------- */
  .dice-wrap { text-align: center; width: 100%; }
  .dice { display: flex; justify-content: center; gap: 3vw; margin-top: 1.4vh; }
  .die { width: 7.6vw; text-align: center; }
  .die svg { width: 100%; height: auto; overflow: visible; display: block; }
  .die .shape { fill: rgba(10,8,25,0.85); stroke-width: 2.2; }
  .die .facet { fill: none; stroke-width: 1.2; opacity: 0.7; }
  .die .num { font-family: "Chakra Petch", "Orbitron", sans-serif; font-weight: 700; font-size: 26px; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .die.tens .shape, .die.tens .facet { stroke: var(--magenta); }
  .die.ones .shape, .die.ones .facet { stroke: var(--cyan); }
  .die.tens svg { filter: drop-shadow(0 0 6px var(--magenta)); }
  .die.ones svg { filter: drop-shadow(0 0 6px var(--cyan)); }

  .die.rolling svg { animation: tumble 0.32s linear infinite; }
  .die.rolling .num { opacity: 0.75; }
  .die.landed svg { animation: land 0.5s ease-out; }
  @keyframes tumble {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
    25%  { transform: translate(-6%, -8%) rotate(90deg) scale(0.9, 1.05); }
    50%  { transform: translate(5%, 4%) rotate(180deg) scale(1.05, 0.9); }
    75%  { transform: translate(-3%, 6%) rotate(270deg) scale(0.92, 1.04); }
    100% { transform: translate(0, 0) rotate(360deg) scale(1); }
  }
  @keyframes land {
    0% { transform: scale(1.3); filter: brightness(2.2) drop-shadow(0 0 22px #fff); }
    100% { transform: scale(1); }
  }

  .results { text-align: center; width: 100%; align-self: start; padding-top: 1vh; }
  .total {
    height: 5.6vw;
    font-family: "Chakra Petch", "Orbitron", sans-serif; font-weight: 700; font-size: 5.2vw; line-height: 5.6vw;
    color: var(--yellow); text-shadow: 0 0 10px var(--yellow), 0 0 32px rgba(245,255,59,0.6);
    transition: opacity 0.2s;
  }
  .total.hidden { opacity: 0; }
  .total.pop { animation: pop 0.45s ease-out; }
  .verdict {
    height: 2vw; margin-top: 0.4vh;
    font-family: "Orbitron", sans-serif; font-weight: 900; font-size: 1.3vw; line-height: 2vw;
    letter-spacing: 0.5em; padding-left: 0.5em; transition: opacity 0.2s;
  }
  .verdict.success { color: #3dffb0; text-shadow: 0 0 8px #3dffb0, 0 0 22px rgba(61,255,176,0.6); }
  .verdict.failure { color: #ff3b5c; text-shadow: 0 0 8px #ff3b5c, 0 0 22px rgba(255,59,92,0.6); }
  .verdict.hidden { opacity: 0; }
  .verdict.pop { animation: pop 0.45s ease-out 0.15s backwards; }
  @keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }

  /* ---------- Cyberpunk ambience: flicker, glitch slices, jitter, scan sweep ----------
     Each effect runs on its own long loop (~40-70s) with an odd duration so they rarely line up. */

  /* neon tube flicker on section headers */
  .heat .label      { animation: flicker 44s infinite; }
  .dice-wrap .label { animation: flicker 52s infinite 18s; }
  .influence .label { animation: flicker 57s infinite 9s; }
  .day .label       { animation: flicker 63s infinite 27s; }
  @keyframes flicker {
    0%, 92.5%, 93.125%, 93.5%, 94%, 100%  { opacity: 1; }
    92.75%, 93.25%   { opacity: 0.25; }
    93.75%        { opacity: 0.6; }
  }

  /* RGB-split glitch slices on the values (text mirrored into data-text by the script) */
  .glitch { position: relative; }
  .glitch::before, .glitch::after {
    content: attr(data-text); position: absolute; inset: 0;
    text-shadow: none; pointer-events: none; clip-path: inset(100% 0 0 0);
  }
  .glitch::before { color: var(--cyan);    opacity: 0.85; animation: glitchA 36s infinite steps(1); }
  .glitch::after  { color: var(--magenta); opacity: 0.85; animation: glitchB 36s infinite steps(1); }
  .heat-value.glitch::before, .heat-value.glitch::after { animation-duration: 38.8s; animation-delay: 4.8s; }
  .total.glitch::before,      .total.glitch::after      { animation-duration: 49.2s; animation-delay: 24s; }
  .verdict.glitch::before,    .verdict.glitch::after    { animation-duration: 59.6s; animation-delay: 12s; }
  #influence.glitch::before,  #influence.glitch::after  { animation-duration: 41.4s; animation-delay: 16s; }
  #day.glitch::before,        #day.glitch::after        { animation-duration: 53.8s; animation-delay: 36s; }
  @keyframes glitchA {
    0%, 97.5%, 100%  { clip-path: inset(100% 0 0 0); transform: none; }
    97.65%  { clip-path: inset(12% 0 58% 0); transform: translate(-0.22em, 0); }
    97.85%  { clip-path: inset(60% 0 15% 0); transform: translate(0.16em, 0); }
    98.05%  { clip-path: inset(35% 0 40% 0); transform: translate(-0.1em, 0); }
    98.25%    { clip-path: inset(100% 0 0 0); }
  }
  @keyframes glitchB {
    0%, 97.575%, 100%  { clip-path: inset(100% 0 0 0); transform: none; }
    97.75%    { clip-path: inset(70% 0 4% 0); transform: translate(0.18em, 0); }
    97.95%  { clip-path: inset(4% 0 72% 0); transform: translate(-0.18em, 0); }
    98.15%  { clip-path: inset(100% 0 0 0); }
  }

  /* occasional skew/shift jitter on the dice and the heat block */
  .die.tens { animation: jitter 42s infinite 8s; }
  .die.ones { animation: jitter 50.8s infinite 28s; }
  .heat-num  { animation: jitter 61.2s infinite 40s; }
  .heat-icon { animation: burn 55.4s infinite 21s; }
  .influence-icon { animation: jitter 45.6s infinite 14s; }
  .day .stat-row  { animation: jitter 66.2s infinite 5s; }
  /* flame gutters: dims, flares, and skews like a bad neon tube */
  @keyframes burn {
    0%, 98.2%, 100% { opacity: 1; transform: none; filter: none; }
    98.35% { opacity: 0.3; }
    98.5%  { opacity: 1; filter: brightness(1.7) hue-rotate(-25deg); transform: skewX(-6deg) translateX(-2px); }
    98.65% { opacity: 0.55; transform: skewX(4deg) translateX(2px); }
    98.8%  { opacity: 1; transform: none; filter: brightness(1.3); }
    99%    { filter: none; }
  }
  @keyframes jitter {
    0%, 98.5%, 100%  { transform: none; filter: none; }
    98.625%  { transform: translate(-3px, 1px) skewX(-8deg); filter: hue-rotate(60deg) brightness(1.4); }
    98.75%    { transform: translate(4px, -1px) skewX(6deg); }
    98.875%  { transform: translate(-1px, 0) skewX(-2deg); filter: hue-rotate(-40deg); }
    99%    { transform: none; filter: none; }
  }

  /* slow bright scanline sweeping down the camera side of the screen (everything beside the panel) */
  .cam-sweep { position: absolute; top: 0; bottom: 0; left: var(--panel-w); right: 0; overflow: hidden; pointer-events: none; }
  body.right .cam-sweep { left: 0; right: var(--panel-w); }
  .cam-sweep::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12vh;
    background: linear-gradient(transparent, rgba(0,240,255,0.07) 45%, rgba(255,255,255,0.12) 50%, rgba(0,240,255,0.07) 55%, transparent);
    animation: sweep 64s linear infinite;
    opacity: 0;
  }
  @keyframes sweep {
    0%    { transform: translateY(-12vh); opacity: 0; }
    0.25%    { opacity: 1; }
    7.5%   { transform: translateY(100vh); opacity: 1; }
    7.75%, 100%  { transform: translateY(100vh); opacity: 0; }
  }

  /* ---------- Advantage / Challenge pool: slot-machine reels + net symbols ---------- */
  .icon .ink { fill: var(--ink); } .icon .paper { fill: var(--paper); }
  .icon .ink-stroke { stroke: var(--ink); } .icon .paper-stroke { stroke: var(--paper); }
  .adv  { --c: #3dffb0; --ink: #3dffb0; --paper: #0b0c10; }
  .chal { --c: #ff3b5c; --ink: #ff3b5c; --paper: #0b0c10; }
  .pool { margin-top: 2.2vh; }
  /* no roll showing: the ROLL label, the dice and the results go (hidden, not removed, so nothing else moves) */
  body.no-roll .dice-wrap, body.no-roll .results { visibility: hidden; }
  .reels { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.7vw; --s: 3.4vw; }
  .reels .gap { width: 1.4vw; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 0.5vh; }
  .slot-die { width: 1.9vw; height: 1.9vw; filter: drop-shadow(0 0 4px var(--c)); animation: flicker 47s infinite 26s; }
  .window {
    width: var(--s); height: var(--s); overflow: hidden; position: relative;
    border: 2px solid var(--c); border-radius: 6px; background: rgba(5,5,12,0.85);
    box-shadow: 0 0 8px color-mix(in srgb, var(--c) 60%, transparent), inset 0 0 10px rgba(0,0,0,0.9);
  }
  /* shading top and bottom, like a slot window */
  .window::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(rgba(0,0,0,0.55), transparent 30%, transparent 70%, rgba(0,0,0,0.55)); }
  .strip { will-change: transform; }
  .strip.spinning .face { filter: blur(1.5px); }
  .face { width: var(--s); height: var(--s); display: grid; place-items: center; }
  .face .icon { width: 72%; height: 72%; filter: drop-shadow(0 0 5px var(--c)); }
  .face.blank::before { content: ""; width: 30%; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--c) 35%, transparent); }
  .slot.landed .window { animation: slotLand 0.45s ease-out; }
  @keyframes slotLand { 0% { transform: scale(1.18); box-shadow: 0 0 22px var(--c); } 100% { transform: scale(1); } }

  .net { margin-top: 1.8vh; display: flex; flex-direction: column; align-items: center; gap: 0.6vh; min-height: 5vw; }
  .net.hidden { visibility: hidden; }
  .net-icons { display: flex; align-items: center; gap: 0.5vw; height: 2.6vw; }
  .net-icons .icon { width: 2.6vw; height: 2.6vw; filter: drop-shadow(0 0 6px var(--c)); }
  .net-icons .cancelled { opacity: 0.22; filter: grayscale(1); }
  .net-icons .sep { width: 2px; height: 70%; background: rgba(255,255,255,0.18); margin: 0 0.6vw; }
  .net-icons .pop { animation: pop 0.4s ease-out backwards; }
  .net-label { font-family: "Orbitron", sans-serif; font-weight: 900; font-size: 1.15vw; letter-spacing: 0.4em; padding-left: 0.4em; }
  .net-label.boon { color: #3dffb0; text-shadow: 0 0 8px #3dffb0; }
  .net-label.drawback { color: #ff3b5c; text-shadow: 0 0 8px #ff3b5c; }
  .net-label.even { color: #b9b7d8; text-shadow: 0 0 8px rgba(185,183,216,0.6); }
  .net-label.glitch::before, .net-label.glitch::after { animation-duration: 43.4s; animation-delay: 30s; }

  /* ---------- Ticker: a news-crawl along the bottom of the camera side ---------- */
  .ticker {
    position: absolute; left: var(--panel-w); right: 0; bottom: 0; height: 3.4vw;
    display: flex; align-items: stretch;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 3px),
      linear-gradient(rgba(7,6,15,0.86), rgba(7,6,15,0.96));
    border-top: 2px solid var(--yellow);
    box-shadow: 0 0 16px rgba(245,255,59,0.7), inset 0 10px 14px -12px var(--yellow);
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s;
  }
  body.right .ticker { left: 0; right: var(--panel-w); }
  .ticker.off { transform: translateY(115%); opacity: 0; }
  .ticker-tag {
    flex: none; display: flex; align-items: center; gap: 0.6vw;
    padding: 0 2.2vw 0 1.2vw; background: var(--yellow); color: #07060f;
    font-family: "Orbitron", sans-serif; font-weight: 900; font-size: 1.1vw; letter-spacing: 0.3em;
    clip-path: polygon(0 0, 100% 0, calc(100% - 1.4vw) 100%, 0 100%);
    animation: flicker 47s infinite 11s;
  }
  /* blinking "live" block */
  .ticker-tag::before { content: ""; width: 0.6vw; height: 0.6vw; background: #07060f; animation: blink 1.2s steps(1) infinite; }
  /* hazard stripes before the slanted edge */
  .ticker-tag::after { content: ""; width: 1.6vw; height: 55%; margin-left: 0.4vw;
    background: repeating-linear-gradient(-45deg, #07060f 0 0.22vw, transparent 0.22vw 0.48vw); }
  @keyframes blink { 50% { opacity: 0; } }
  .ticker-window {
    flex: 1; min-width: 0; overflow: hidden; display: flex; align-items: center;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
    animation: jitter 39.4s infinite 17s;
  }
  .ticker-track { display: flex; align-items: center; white-space: nowrap; will-change: transform; animation: tick var(--dur, 30s) linear infinite; }
  @keyframes tick { to { transform: translateX(-50%); } }
  .ticker-item {
    font-size: 1.6vw; line-height: 1; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cyan);
    text-shadow: 0 0 6px var(--cyan), 0 0 18px rgba(0,240,255,0.55);
  }
  /* a drawn diamond (a ◆ glyph sits on the baseline, off the capitals' middle) */
  .ticker-sep { flex: none; width: 0.5vw; height: 0.5vw; margin: 0 2.4vw; transform: rotate(45deg);
    background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }

  /* ---------- Sign: CONSUME / OBEY in the camera's top corner ---------- */
  .sign {
    --sc: var(--cyan);
    position: absolute; top: 2.6vh; right: 1.6vw; width: 25vw; height: 6.4vw;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3vw;
    color: var(--sc);
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 3px),
      linear-gradient(90deg, color-mix(in srgb, var(--sc) 24%, transparent), transparent 70%),
      rgba(7,6,15,0.78);
    clip-path: polygon(1.2vw 0, 100% 0, 100% calc(100% - 1.2vw), calc(100% - 1.2vw) 100%, 0 100%, 0 1.2vw);
  }
  /* border in the sign's colour: a thick bar on the left, hairlines top and bottom (cut with the corners) */
  .sign::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border: 2px solid var(--sc); border-left-width: 0.45vw; border-right-width: 0;
  }
  /* hazard stripes in the top corner, like the ticker's */
  .sign::after {
    content: ""; position: absolute; top: 0.7vw; right: 0.9vw; width: 3.2vw; height: 0.45vw; pointer-events: none;
    background: repeating-linear-gradient(-45deg, var(--sc) 0 0.22vw, transparent 0.22vw 0.48vw);
  }
  body.right .sign { right: calc(var(--panel-w) + 1.6vw); }
  .sign.obey { --sc: #ff3b5c; }
  .sign-caption { font-size: 0.85vw; letter-spacing: 0.4em; padding-left: 0.4em; text-shadow: 0 0 6px var(--sc); }
  .sign-word {
    position: relative;
    font-family: "Orbitron", sans-serif; font-weight: 900; font-size: 2.3vw; line-height: 1;
    letter-spacing: 0.32em; padding-left: 0.32em; color: #fff;
    text-shadow: 0 0 6px var(--sc), 0 0 18px var(--sc), 0 0 40px var(--sc);
    animation: flicker 41s infinite 6s;
  }
  /* RGB-split copies of the word, only seen while glitching */
  .sign-word::before, .sign-word::after {
    content: attr(data-text); position: absolute; inset: 0; padding-left: inherit;
    text-shadow: none; pointer-events: none; clip-path: inset(100% 0 0 0);
  }
  .sign-word::before { color: var(--magenta); }
  .sign-word::after  { color: var(--cyan); }
  .sign.obey .sign-word::before { color: var(--yellow); }

  /* a small slip partway through CONSUME */
  .sign.blip .sign-word::before { animation: blipA 0.3s steps(1); }
  .sign.blip .sign-word::after  { animation: blipB 0.3s steps(1); }
  @keyframes blipA { 0% { clip-path: inset(20% 0 55% 0); transform: translate(-0.18em, 0); } 50% { clip-path: inset(62% 0 12% 0); transform: translate(0.12em, 0); } 100% { clip-path: inset(100% 0 0 0); } }
  @keyframes blipB { 0% { clip-path: inset(58% 0 20% 0); transform: translate(0.16em, 0); } 50% { clip-path: inset(8% 0 70% 0); transform: translate(-0.1em, 0); } 100% { clip-path: inset(100% 0 0 0); } }

  /* the hard glitch between words: the whole sign tears, jumps and flashes */
  .sign.hard { animation: signTear 0.7s steps(1); }
  .sign.hard .sign-word { animation: wordTear 0.7s steps(1); }
  .sign.hard .sign-word::before { animation: hardA 0.7s steps(1); }
  .sign.hard .sign-word::after  { animation: hardB 0.7s steps(1); }
  @keyframes signTear {
    0%   { transform: translate(-6px, 2px) skewX(-10deg); filter: hue-rotate(90deg) brightness(1.6); }
    12%  { transform: translate(8px, -3px) skewX(8deg); opacity: 0.4; }
    24%  { transform: translate(-3px, 0) skewX(-3deg); filter: invert(1); opacity: 1; }
    36%  { transform: translate(5px, 4px) scaleY(0.82); filter: hue-rotate(-60deg) brightness(2); }
    48%  { transform: none; opacity: 0.15; filter: none; }
    60%  { transform: translate(-9px, -2px) skewX(12deg); opacity: 1; filter: brightness(1.8); }
    72%  { transform: translate(3px, 1px) scaleX(1.06); filter: hue-rotate(140deg); }
    84%  { transform: translate(-2px, 0) skewX(-4deg); opacity: 0.6; filter: none; }
    100% { transform: none; opacity: 1; filter: none; }
  }
  @keyframes wordTear {
    0%, 24%, 60% { clip-path: inset(0 0 48% 0); transform: translateX(0.3em); }
    12%, 48%, 84% { clip-path: inset(46% 0 0 0); transform: translateX(-0.25em); }
    36%, 72% { clip-path: inset(0 0 0 0); transform: translateX(0.12em) scaleX(1.08); }
    100% { clip-path: inset(0 0 0 0); transform: none; }
  }
  @keyframes hardA {
    0%   { clip-path: inset(5% 0 62% 0);  transform: translate(-0.35em, 0); }
    14%  { clip-path: inset(48% 0 18% 0); transform: translate(0.3em, 0); }
    28%  { clip-path: inset(0 0 80% 0);   transform: translate(-0.2em, 0); }
    42%  { clip-path: inset(70% 0 0 0);   transform: translate(0.4em, 0); }
    56%  { clip-path: inset(25% 0 40% 0); transform: translate(-0.45em, 0); }
    70%  { clip-path: inset(60% 0 8% 0);  transform: translate(0.2em, 0); }
    85%, 100% { clip-path: inset(100% 0 0 0); transform: none; }
  }
  @keyframes hardB {
    0%   { clip-path: inset(55% 0 10% 0); transform: translate(0.32em, 0); }
    14%  { clip-path: inset(10% 0 70% 0); transform: translate(-0.36em, 0); }
    28%  { clip-path: inset(40% 0 30% 0); transform: translate(0.24em, 0); }
    42%  { clip-path: inset(0 0 65% 0);   transform: translate(-0.3em, 0); }
    56%  { clip-path: inset(75% 0 0 0);   transform: translate(0.38em, 0); }
    70%  { clip-path: inset(15% 0 55% 0); transform: translate(-0.16em, 0); }
    85%, 100% { clip-path: inset(100% 0 0 0); transform: none; }
  }

  /* ---------- Planning: a countdown that takes over the whole panel ---------- */
  .panel.planning-on > :not(.planning, .status) { display: none; }
  .planning {
    grid-row: 1 / -1; align-self: stretch;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh;
    --glow: var(--cyan);
  }
  .planning[hidden] { display: none; }
  .planning .label { font-size: 1.6vw; }
  /* minutes over seconds, so the digits can fill the tall panel; each digit gets a fixed width so nothing shifts */
  .clock {
    display: flex; flex-direction: column; align-items: center;
    font-family: "Orbitron", sans-serif; font-weight: 900; font-size: min(19vw, 36vh); line-height: 1;
    color: #eaffff;
    text-shadow: 0 0 6px #fff, 0 0 20px var(--glow), 0 0 48px var(--glow), 0 0 96px var(--glow);
  }
  .clock-row { display: flex; }
  .clock-row span { width: 0.86em; text-align: center; }
  .clock-sep {
    width: 1.5em; height: 0.035em; margin: 0.07em 0;
    background: var(--magenta); box-shadow: 0 0 10px var(--magenta), 0 0 24px var(--magenta);
  }
  .planning.paused .clock, .planning.paused .clock-sep { opacity: 0.4; }
  .planning.paused .label { animation: blink 1.2s steps(1) infinite; }
  /* time's up: the clock flashes for FLASH_MS */
  .planning.done { --glow: var(--yellow); }
  .planning.done .label { color: var(--yellow); text-shadow: 0 0 8px var(--yellow); }
  .planning.done .clock, .planning.done .clock-sep { animation: timeUp 0.5s steps(1) infinite; }
  @keyframes timeUp { 50% { opacity: 0.08; } }

  /* connection warning, only visible while OBS link is down */
  .status {
    position: absolute; bottom: 1.2vh; left: 0; right: 0; text-align: center;
    font-size: 0.75vw; color: #ff5a6e; letter-spacing: 0.1em; opacity: 0.85;
  }
</style>
</head>
<body>
<div class="cam-sweep"></div>
<div class="sign" id="sign">
  <div class="sign-caption">NBN · CIVIC NOTICE</div>
  <div class="sign-word" id="signWord" data-text="CONSUME">CONSUME</div>
</div>
<div class="ticker off" id="ticker">
  <div class="ticker-tag">NBN</div>
  <div class="ticker-window"><div class="ticker-track" id="tickerTrack"></div></div>
</div>
<div class="panel">
  <section class="heat">
    <div class="label">HEAT</div>
    <div class="heat-row">
      <span data-icon="heat" data-cls="heat-icon"></span>
      <div class="heat-num"><div class="heat-value glitch" id="heat" data-text="0">0</div></div>
    </div>
  </section>

  <section class="stats">
    <div class="stat influence">
      <div class="label">GROUP INFLUENCE</div>
      <div class="stat-row">
        <span data-icon="influence" data-cls="influence-icon"></span>
        <div class="stat-value glitch" id="influence" data-text="0">0</div>
      </div>
    </div>
    <div class="stat day">
      <div class="label">DAY</div>
      <div class="stat-row"><div class="stat-value glitch" id="day" data-text="0">0</div></div>
    </div>
  </section>

  <section class="dice-wrap">
    <div class="label">ROLL</div>
    <div class="dice">
      <div class="die tens" id="dieTens">
        <svg viewBox="0 0 100 100">
          <polygon class="shape" points="50,3 96,46 96,58 50,97 4,58 4,46"/>
          <polyline class="facet" points="4,46 26,56 50,3 74,56 96,46"/>
          <polyline class="facet" points="26,56 50,70 74,56"/>
          <line class="facet" x1="50" y1="70" x2="50" y2="97"/>
          <text class="num" x="50" y="44">–</text>
        </svg>
      </div>
      <div class="die ones" id="dieOnes">
        <svg viewBox="0 0 100 100">
          <polygon class="shape" points="50,3 96,46 96,58 50,97 4,58 4,46"/>
          <polyline class="facet" points="4,46 26,56 50,3 74,56 96,46"/>
          <polyline class="facet" points="26,56 50,70 74,56"/>
          <line class="facet" x1="50" y1="70" x2="50" y2="97"/>
          <text class="num" x="50" y="44">–</text>
        </svg>
      </div>
    </div>
  </section>

  <section class="results">
    <div class="total glitch hidden" id="total">—</div>
    <div class="verdict glitch hidden" id="verdict"></div>
    <div class="pool" id="pool" hidden>
      <div class="reels" id="reels"></div>
      <div class="net hidden" id="net">
        <div class="net-icons" id="netIcons"></div>
        <div class="net-label glitch" id="netLabel"></div>
      </div>
    </div>
  </section>

  <section class="planning" id="planning" hidden>
    <div class="label" id="planLabel">PLANNING</div>
    <div class="clock" id="clock">
      <div class="clock-row" id="clockMin"></div>
      <div class="clock-sep"></div>
      <div class="clock-row" id="clockSec"></div>
    </div>
  </section>

  <div class="status" id="status"></div>
</div>

<script>
  const { config, connect } = window.NCD_OBS_LINK;
  const { STATS, clampStat, cleanTicker, planningLeft, planningStep, cleanPlanning, fmtClock, make, read } = window.NCD_OVERLAY;
  if (config?.side === "right") document.body.classList.add("right");

  const totalEl = document.getElementById("total");
  const verdictEl = document.getElementById("verdict");
  const statusEl = document.getElementById("status");
  const tensDie = document.getElementById("dieTens");
  const onesDie = document.getElementById("dieOnes");
  const tensNum = tensDie.querySelector(".num");
  const onesNum = onesDie.querySelector(".num");

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // ---- Stats: Heat, Group Influence, Day ----
  const { svg: icon } = window.NCD_ICONS;
  document.querySelectorAll("[data-icon]").forEach((el) => (el.outerHTML = icon(el.dataset.icon, el.dataset.cls || "")));

  // each stat's limits are in overlay-rules.js
  const stats = {};
  for (const key in STATS) stats[key] = clampStat(key, store.get("nco." + key, 0));
  const statEl = (key) => document.getElementById(key);

  function renderStat(key, animate) {
    const el = statEl(key), v = stats[key];
    const prev = Number(el.dataset.value ?? v);
    el.dataset.value = v;
    // Day 0 is the Broker phase
    const text = key === "day" && v === 0 ? "BROKER" : String(v);
    el.textContent = el.dataset.text = text;
    if (key === "day") el.classList.toggle("broker", v === 0);
    if (key === "heat") {
      // glow shifts from orange toward hot pink/white as heat climbs
      const t = Math.min(v, 10) / 10;
      el.closest(".heat").style.setProperty("--glow", `hsl(${14 - t * 34}, 100%, ${56 + t * 10}%)`);
    }
    if (animate && prev !== v) {
      el.classList.remove("bump-up", "bump-down");
      void el.offsetWidth;
      el.classList.add(v > prev ? "bump-up" : "bump-down");
    }
  }
  function setStat(key, v, animate = true) {
    if (!(key in STATS)) return;
    stats[key] = clampStat(key, v);
    store.set("nco." + key, stats[key]);
    renderStat(key, animate);
  }
  for (const key in STATS) renderStat(key, false);

  // ---- Ticker ----
  // The items run one after another with a ◆ between each; that run repeats enough times to fill the bar twice,
  // and the track slides left by half for a seamless loop.
  const tickerEl = document.getElementById("ticker");
  const tickerTrack = document.getElementById("tickerTrack");
  let ticker = cleanTicker(store.get("nco.ticker", []));
  const TICKER_SPEED = 0.06;   // share of the screen width scrolled per second

  const tickerUnit = () => ticker.flatMap((t) => [
    Object.assign(document.createElement("span"), { className: "ticker-item", textContent: t }),
    Object.assign(document.createElement("span"), { className: "ticker-sep" }),
  ]);
  function renderTicker() {
    // an empty ticker slides away with its old text still on it
    tickerEl.classList.toggle("off", !ticker.length);
    if (!ticker.length) return;
    tickerTrack.replaceChildren(...tickerUnit());
    const unitW = tickerTrack.scrollWidth || 1;
    const copies = Math.ceil(tickerTrack.parentElement.clientWidth / unitW) + 1;
    tickerTrack.replaceChildren(...Array.from({ length: copies * 2 }, tickerUnit).flat());
    tickerTrack.style.setProperty("--dur", `${(copies * unitW) / (innerWidth * TICKER_SPEED)}s`);
    // restart from the beginning so new text starts at the right edge of the loop
    tickerTrack.style.animation = "none";
    void tickerTrack.offsetWidth;
    tickerTrack.style.animation = "";
  }
  function setTicker(items) {
    ticker = cleanTicker(items);
    store.set("nco.ticker", ticker);
    renderTicker();
  }
  renderTicker();
  // widths change once the web font arrives
  document.fonts?.ready.then(renderTicker);

  // ---- Dice ----
  const fmtTens = (n) => (n === 0 ? "00" : String(n * 10));
  const totalOf = (t, o) => (t * 10 + o === 0 ? 100 : t * 10 + o);
  let rollTimer = null;

  // target: roll at or under it succeeds; null means no target, so no verdict
  function showResult(tens, ones, target, animate) {
    const total = totalOf(tens, ones);
    tensNum.textContent = fmtTens(tens);
    onesNum.textContent = String(ones);
    totalEl.textContent = totalEl.dataset.text = total;
    totalEl.classList.remove("hidden", "pop");
    verdictEl.className = "verdict glitch";
    if (target == null) {
      verdictEl.textContent = verdictEl.dataset.text = "";
      verdictEl.classList.add("hidden");
    } else {
      const ok = total <= target;
      verdictEl.textContent = verdictEl.dataset.text = ok ? "SUCCESS" : "FAILURE";
      verdictEl.classList.add(ok ? "success" : "failure");
    }
    if (animate) {
      for (const d of [tensDie, onesDie]) { d.classList.remove("landed"); void d.offsetWidth; d.classList.add("landed"); }
      void totalEl.offsetWidth;
      totalEl.classList.add("pop");
      if (target != null) verdictEl.classList.add("pop");
    }
  }

  // ---- Advantage / Challenge reels ----
  // adv/chal are arrays of booleans: true = the die came up Boon / Drawback.
  const poolEl = document.getElementById("pool");
  const reelsEl = document.getElementById("reels");
  const netEl = document.getElementById("net");
  const netIcons = document.getElementById("netIcons");
  const netLabel = document.getElementById("netLabel");
  const reelStopAt = (i) => 1700 + i * 220;   // ms
  let poolTimers = [];

  const faceHTML = (kind, hit) =>
    hit ? `<div class="face">${icon(kind === "adv" ? "boon" : "drawback")}</div>` : `<div class="face blank"></div>`;

  // Boons and Drawbacks cancel one-for-one; survivors glow, cancelled pairs are greyed out
  function showNet(boons, drawbacks, animate) {
    const kept = boons - drawbacks, pairs = Math.min(boons, drawbacks);
    const live = kept > 0 ? Array(kept).fill("boon") : Array(-kept).fill("drawback");
    let html = live.map((n, i) =>
      `<span class="${n === "boon" ? "adv" : "chal"} ${animate ? "pop" : ""}" style="animation-delay:${i * 0.08}s">${icon(n)}</span>`).join("");
    if (pairs) {
      if (live.length) html += `<span class="sep"></span>`;
      for (let i = 0; i < pairs; i++) html += `<span class="adv cancelled">${icon("boon")}</span><span class="chal cancelled">${icon("drawback")}</span>`;
    }
    netIcons.innerHTML = html;
    netLabel.className = "net-label glitch " + (kept > 0 ? "boon" : kept < 0 ? "drawback" : "even");
    netLabel.textContent = netLabel.dataset.text =
      kept > 0 ? `+${kept} BOON${kept > 1 ? "S" : ""}` :
      kept < 0 ? `+${-kept} DRAWBACK${kept < -1 ? "S" : ""}` :
      boons ? "ALL CANCELLED" : "NO SYMBOLS";
    netEl.classList.remove("hidden");
  }

  function rollPool(adv, chal, animate) {
    poolTimers.forEach(clearTimeout); poolTimers = [];
    const dice = [...adv.map((hit) => ["adv", hit]), ...chal.map((hit) => ["chal", hit])];
    poolEl.hidden = dice.length === 0;
    netEl.classList.add("hidden");
    if (!dice.length) return;

    reelsEl.innerHTML = dice.map(([kind, hit], i) => {
      // random filler faces at the die's real odds, ending on the rolled face
      const odds = kind === "adv" ? 0.5 : 0.6, len = animate ? 14 + i * 3 : 1;
      const faces = Array.from({ length: len - 1 }, () => faceHTML(kind, Math.random() < odds)).join("") + faceHTML(kind, hit);
      const gap = kind === "chal" && i === adv.length && adv.length ? `<div class="gap"></div>` : "";
      return `${gap}<div class="slot ${kind}" data-len="${len}">
        ${icon(kind === "adv" ? "advantage-die" : "challenge-die", "slot-die")}
        <div class="window"><div class="strip">${faces}</div></div></div>`;
    }).join("");

    const boons = adv.filter(Boolean).length, drawbacks = chal.filter(Boolean).length;
    if (!animate) { showNet(boons, drawbacks, false); return; }

    reelsEl.querySelectorAll(".slot").forEach((slot, i) => {
      const strip = slot.querySelector(".strip"), len = Number(slot.dataset.len);
      strip.classList.add("spinning");
      void strip.offsetWidth;
      strip.style.transition = `transform ${reelStopAt(i)}ms cubic-bezier(0.2, 0.6, 0.3, 1)`;
      strip.style.transform = `translateY(calc(var(--s) * -${len - 1}))`;
      poolTimers.push(setTimeout(() => { strip.classList.remove("spinning"); slot.classList.add("landed"); }, reelStopAt(i) - 120));
    });
    poolTimers.push(setTimeout(() => showNet(boons, drawbacks, true), reelStopAt(dice.length - 1) + 150));
  }

  function roll(tens, ones, target, adv = [], chal = []) {
    document.body.classList.remove("no-roll");
    rollPool(adv, chal, true);
    clearInterval(rollTimer);
    totalEl.classList.add("hidden");
    verdictEl.classList.add("hidden");
    tensDie.classList.remove("landed"); onesDie.classList.remove("landed");
    tensDie.classList.add("rolling"); onesDie.classList.add("rolling");
    const start = performance.now();
    const DURATION = 1500;
    rollTimer = setInterval(() => {
      tensNum.textContent = fmtTens(Math.floor(Math.random() * 10));
      onesNum.textContent = String(Math.floor(Math.random() * 10));
      if (performance.now() - start >= DURATION) {
        clearInterval(rollTimer);
        tensDie.classList.remove("rolling"); onesDie.classList.remove("rolling");
        showResult(tens, ones, target, true);
        store.set("nco.lastRoll", [tens, ones, target, adv, chal]);
      }
    }, 70);
  }

  // back to the empty state: no dice, total, verdict or pool
  function clearRoll() {
    document.body.classList.add("no-roll");
    clearInterval(rollTimer);
    poolTimers.forEach(clearTimeout); poolTimers = [];
    tensDie.classList.remove("rolling", "landed"); onesDie.classList.remove("rolling", "landed");
    tensNum.textContent = onesNum.textContent = "–";
    totalEl.classList.add("hidden");
    verdictEl.classList.add("hidden");
    poolEl.hidden = true;
    store.set("nco.lastRoll", null);
  }

  const last = store.get("nco.lastRoll", null);
  if (last) { showResult(last[0], last[1], last[2] ?? null, false); rollPool(last[3] || [], last[4] || [], false); }
  else clearRoll();

  // ---- Planning ----
  // A countdown that replaces everything on the panel. At zero it flashes for FLASH_MS, then the panel comes back,
  // without the roll from before (so does Stop).
  // The countdown's rules are in overlay-rules.js; planning is null when none is on.
  const panelEl = document.querySelector(".panel");
  const planEl = document.getElementById("planning");
  const planLabel = document.getElementById("planLabel");
  const clockMin = document.getElementById("clockMin");
  const clockSec = document.getElementById("clockSec");
  const FLASH_MS = 3000;
  let planning = cleanPlanning(store.get("nco.planning", null), Date.now());
  let planTimer = null, flashTimer = null;

  const digits = (el, text) => el.replaceChildren(...[...text].map((ch) => Object.assign(document.createElement("span"), { textContent: ch })));
  function showClock(ms) {
    const [mm, ss] = fmtClock(ms).split(":");
    digits(clockMin, mm);
    digits(clockSec, ss);
  }
  function renderPlanning() {
    clearInterval(planTimer);
    const done = planEl.classList.contains("done");
    planEl.hidden = !planning && !done;
    panelEl.classList.toggle("planning-on", !planEl.hidden);
    planEl.classList.toggle("paused", planning?.running === false);
    planLabel.textContent = done ? "TIME" : planning?.running === false ? "PAUSED" : "PLANNING";
    if (!planning) return;
    const tick = () => {
      const left = planningLeft(planning, Date.now());
      showClock(left);
      if (!left) timeUp();
    };
    tick();
    if (planning?.running) planTimer = setInterval(tick, 200);
  }
  function setPlanning(next) {
    planning = next;
    store.set("nco.planning", planning);
    renderPlanning();
    reportState();
  }
  function endFlash() {
    clearTimeout(flashTimer);
    planEl.classList.remove("done");
  }
  function timeUp() {
    endFlash();
    showClock(0);
    planEl.classList.add("done");
    flashTimer = setTimeout(() => { endFlash(); renderPlanning(); }, FLASH_MS);
    clearRoll();
    setPlanning(null);
  }
  // msg is a planning message: { action, seconds }
  function planningAction(msg) {
    endFlash();
    const next = planningStep(planning, msg, Date.now());
    if (planning && !next) clearRoll();
    setPlanning(next);
  }

  // ---- Sign ----
  // CONSUME for 50s with one small slip somewhere in the middle, then a hard glitch into OBEY for 10s, and a hard
  // glitch back. The word swaps halfway through each hard glitch.
  const signEl = document.getElementById("sign");
  const signWord = document.getElementById("signWord");
  const SIGN = [{ word: "CONSUME", ms: 50000 }, { word: "OBEY", ms: 10000 }];
  const HARD_MS = 700;

  function glitchSign(kind, ms) {
    signEl.classList.remove(kind);
    void signEl.offsetWidth;
    signEl.classList.add(kind);
    setTimeout(() => signEl.classList.remove(kind), ms);
  }
  function showSign(i) {
    const { word, ms } = SIGN[i];
    signWord.textContent = signWord.dataset.text = word;
    signEl.classList.toggle("obey", word === "OBEY");
    if (word === "CONSUME") setTimeout(() => glitchSign("blip", 300), 15000 + Math.random() * 25000);
    setTimeout(() => {
      glitchSign("hard", HARD_MS);
      setTimeout(() => showSign((i + 1) % SIGN.length), HARD_MS / 2);
    }, ms - HARD_MS / 2);
  }
  showSign(0);

  // ---- OBS link ----
  // The overlay owns the displayed state; the dashboard asks for it ("ping") and adopts it.
  // The messages are in overlay-rules.js; read() drops any it doesn't know or can't use.
  const reportState = () => link.send(make("overlayState", {
    ...stats, ticker,
    planning: planning && { running: planning.running, left: planningLeft(planning, Date.now()) },
  }));
  // Without obs-config.js there's no OBS to listen to; say so instead of failing quietly.
  if (!config) statusEl.textContent = "No obs-config.js: copy obs-config.example.js to obs-config.js and fill it in";
  const link = !config ? { send() {} } : connect({
    onStatus(s, detail) {
      statusEl.textContent = s === "connected" || s === "connecting" ? "" : detail || "";
      if (s === "connected") reportState();
    },
    onMessage(raw) {
      const msg = read(raw);
      if (!msg) return;
      if (msg.type === "stat") setStat(msg.key, msg.value);
      else if (msg.type === "roll") roll(msg.tens, msg.ones, msg.target, msg.adv, msg.chal);
      else if (msg.type === "clearRoll") clearRoll();
      else if (msg.type === "ticker") setTicker(msg.items);
      else if (msg.type === "planning") planningAction(msg);
      else if (msg.type === "ping") reportState();
    },
  });
  renderPlanning();

  // Keyboard testing when the page is open in a normal browser
  const rand10 = () => Math.floor(Math.random() * 10);
  addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp" || e.key === "+" || e.key === "=") setStat("heat", stats.heat + 1);
    else if (e.key === "ArrowDown" || e.key === "-") setStat("heat", stats.heat - 1);
    else if (e.key === "i") setStat("influence", (stats.influence + 1) % 4);
    else if (e.key === "d") setStat("day", (stats.day + 1) % 11);
    else if (e.key === "p") planningAction({ action: planning ? "stop" : "start", seconds: 5 });
    else if (e.key === "o") planningAction({ action: planning?.running ? "pause" : "play" });
    else if (e.key === " " || e.key === "r") {
      const n = () => Math.floor(Math.random() * 5);
      roll(rand10(), rand10(), 50, Array.from({ length: n() }, () => Math.random() < 0.5), Array.from({ length: n() }, () => Math.random() < 0.6));
    }
  });
</script>
</body>
</html>
