<!doctype html>
<html lang="en" class="wa-theme-default wa-brand-cyan">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon City Dashboard</title>
<link rel="icon" href="icons/advantage-die.svg" type="image/svg+xml">

<!-- Pick the theme before anything paints so there's no light/dark flash. -->
<script>
  (function () {
    let saved = null;
    try { saved = localStorage.getItem("ncd.theme"); } catch {}
    const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.add(dark ? "wa-dark" : "wa-light");
  })();
</script>

<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/webawesome.css">
<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" data-icon="advantage-die"></span>
      <h1>Neon City <span>Dashboard</span></h1>
    </div>
    <wa-button id="theme-toggle" appearance="plain" size="s" title="Toggle light/dark">
      <wa-icon name="moon" label="Toggle light/dark"></wa-icon>
    </wa-button>
  </header>

  <main>
    <wa-tab-group id="tabs">
      <wa-tab panel="dice">Dice</wa-tab>
      <wa-tab panel="roster">Roster</wa-tab>
      <wa-tab panel="settings">Settings</wa-tab>

      <wa-tab-panel name="dice">
        <div class="dice-layout">
          <wa-card class="roller">
            <wa-input id="target" label="Target ≤" placeholder="none" inputmode="numeric" maxlength="3"
              autocomplete="off" with-clear></wa-input>

            <wa-radio-group id="adv" class="pool adv" orientation="horizontal" value="0">
              <span slot="label" class="pool-label"><span data-icon="advantage-die"></span>Advantage dice</span>
            </wa-radio-group>

            <wa-radio-group id="chal" class="pool chal" orientation="horizontal" value="0">
              <span slot="label" class="pool-label"><span data-icon="challenge-die"></span>Challenge dice</span>
            </wa-radio-group>

            <wa-button id="roll" variant="brand" size="l" class="roll-button">
              <wa-icon slot="start" name="dice-d20"></wa-icon>
              Roll d100
            </wa-button>
            <p class="keys">or press <kbd>R</kbd></p>
          </wa-card>

          <section class="result" id="result" aria-live="polite">
            <p class="result-empty">No rolls yet</p>
          </section>
        </div>

        <wa-card class="discord-card">
          <div slot="header" class="card-header"><h2>Discord</h2></div>
          <wa-switch id="custom-name">Post as “Neon City Dashboard” instead of the webhook’s own name</wa-switch>
          <wa-details summary="Message preview" appearance="filled" class="payload">
            <pre id="payload"></pre>
          </wa-details>
        </wa-card>
      </wa-tab-panel>

      <wa-tab-panel name="roster"></wa-tab-panel>
      <wa-tab-panel name="settings">
        <wa-card class="settings-card">
          <div slot="header" class="card-header"><h2>Player</h2></div>
          <wa-input id="player-name" label="Player name:" placeholder="Player" autocomplete="off"></wa-input>
          <wa-switch id="gm">Administrator (GM)</wa-switch>
        </wa-card>
      </wa-tab-panel>
    </wa-tab-group>
  </main>

  <wa-toast id="toast" placement="bottom-center"></wa-toast>

  <script src="config.js" onerror="window.NCD_CONFIG = window.NCD_CONFIG || {}"></script>
  <script src="icons.js"></script>
  <script src="dice.js"></script>
  <script src="discord.js"></script>
  <script src="app.js"></script>
</body>
</html>
